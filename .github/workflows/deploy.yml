name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}

  deploy-vps:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    # Ativado apenas quando há VPS configurada
    if: ${{ vars.VPS_CONFIGURED == 'true' }}

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/fieldsync
            export VERSION=${{ github.sha }}
            export GHCR_REPOSITORY=${{ github.repository }}

            # 1) Backup ANTES de qualquer migration — ver "Rollback de Deploy e Migrations" na especificação
            ./infra/scripts/backup.sh

            # 2) Sobe as novas imagens
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            # 3) Aplica migrations
            docker compose exec -T backend npx prisma migrate deploy

            # 3b) Garante o usuário Administrador — idempotente e seguro em
            #     todo deploy: com NODE_ENV=production (.env do servidor),
            #     o seed cria só o Administrador (ADMIN_PASSWORD) e nunca
            #     dados de exemplo; se ele já existir, a senha não é
            #     sobrescrita (ver prisma/seed.ts).
            docker compose exec -T backend npx prisma db seed

            # 4) Smoke test — se falhar, o job para AQUI e não faz cleanup,
            #    para o time investigar com o container antigo ainda disponível na registry
            for i in 1 2 3 4 5; do
              if curl -fsS http://localhost/api/v1/health; then
                echo "Smoke test OK"; break
              fi
              if [ "$i" = "5" ]; then
                echo "Smoke test FALHOU após deploy — ver 'Rollback de Deploy e Migrations'"
                exit 1
              fi
              sleep 5
            done

            # 5) Só faz cleanup de imagens antigas se o smoke test passou
            docker image prune -f
