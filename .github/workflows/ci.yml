name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  # Lint, testes unitários e de integração (contra um Postgres/PostGIS de
  # teste, ver 6.2 na especificação) e npm audit (OWASP A06).
  test-backend:
    name: Backend — Lint, Testes e Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: fieldsync_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/fieldsync_test
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long_ok

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - run: npm ci

      - name: Extensões do Postgres (postgis, uuid-ossp, pg_trgm)
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d fieldsync_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=test_password psql -h localhost -U test_user -d fieldsync_test -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          PGPASSWORD=test_password psql -h localhost -U test_user -d fieldsync_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm run test

      - name: Testes de integração (motor de sync — POST /sync)
        run: npm run test:e2e

      # continue-on-error: hoje há vulnerabilidades ALTAS pré-existentes só
      # corrigíveis via upgrade de major do NestJS (10→11/12, fora de escopo
      # desta revisão). Deixar bloqueante agora
      # tornaria o CI permanentemente vermelho; o passo continua reportando
      # para pegar vulnerabilidades NOVAS introduzidas por PRs futuros.
      - name: npm audit (dependências de produção)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

  lint-web:
    name: Lint — Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint

      # continue-on-error: mesmo racional do backend — reporta vulnerabilidades
      # novas sem tornar o CI bloqueante por achados pré-existentes fora de
      # escopo desta revisão.
      - name: npm audit (dependências de produção)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  lint-mobile:
    name: Lint e Testes — Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # continue-on-error: mesmo racional do backend — reporta vulnerabilidades
      # novas sem tornar o CI bloqueante por achados pré-existentes (hoje,
      # apenas na árvore interna de build nativo do Expo) fora de escopo
      # desta revisão.
      - name: npm audit (dependências de produção)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
